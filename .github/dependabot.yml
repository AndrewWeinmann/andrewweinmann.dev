version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    assignees:
      - "AndrewWeinmann"
    cooldown:
      default-days: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 10
    assignees:
      - "AndrewWeinmann"
    cooldown:
      default-days: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
