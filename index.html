<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Weinmann</title>
    <meta name="description" content="Andrew Weinmann — Developer. Site under development.">
    <meta name="author" content="Andrew Weinmann">
    <meta name="theme-color" content="#667eea">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://andrewweinmann.dev/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23764ba2'/%3E%3Ctext x='50' y='68' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif' font-size='56' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EAW%3C/text%3E%3C/svg%3E">
    <meta property="og:title" content="Andrew Weinmann">
    <meta property="og:description" content="Andrew Weinmann — Developer. Site under development.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://andrewweinmann.dev/">
    <meta name="twitter:card" content="summary">
    <style>
        body, h1, p {
            margin: 0;
        }

        body {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
        }

        main {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dot {
                animation: none;
            }
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Andrew Weinmann</h1>
        <p class="tagline">Developer</p>
        <div class="status">
            <span class="dot" aria-hidden="true"></span>
            <span>Site under development</span>
        </div>
    </main>
</body>
</html>
